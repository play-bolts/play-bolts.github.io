# Drop-in for the existing bolts.service. Keep its DB, identity salt and backups.
[Service]
ExecStart=
ExecStart=/opt/bolts/current/bolts-host --mode=directory --config=/etc/bolts-gamelift.json
# The Go directory needs the existing instance role for SSM and GameLift.
# The Rust simulation remains bound to loopback behind the Go listener.
IPAddressDeny=
KillMode=mixed
TimeoutStopSec=45
Restart=always
