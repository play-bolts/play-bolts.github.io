name: Import Bolts source
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify and import reviewed source snapshot
        env:
          ARCHIVE_SHA256: d462f13f68da0c360edaa5ca7f135816b9e81580d62b2ee3a32a87eeb2bdb26e
        run: |
          set -euo pipefail
          cat bolts-source.part[0-9][0-9][0-9] > "$RUNNER_TEMP/bolts-source.tar.gz"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/bolts-source.tar.gz" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/bolts-source"
          python3 - <<'PY'
          import os, pathlib, tarfile
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'bolts-source.tar.gz') as archive:
              for item in archive:
                  path = pathlib.PurePosixPath(item.name)
                  if not item.isfile() or path.is_absolute() or '..' in path.parts or path.parts[0] in {'.git', '.github', 'artifacts', '.aws', '.openai'}:
                      raise RuntimeError('Unexpected archive member')
              archive.extractall(pathlib.Path(os.environ['RUNNER_TEMP']) / 'bolts-source', filter='data')
          PY
          git rm --ignore-unmatch .nojekyll menu.css bolts-source.part[0-9][0-9][0-9]
          cp -a "$RUNNER_TEMP/bolts-source/." .
          git add --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import complete Bolts game and standalone deployment source'
          git push origin HEAD:main
